<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      h1 { margin-bottom: 0.5rem; }
      .summary { margin-bottom: 1rem; }
      table { border-collapse: collapse; width: 100%; max-width: 900px; }
      th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: right; }
      th { background:#f3f3f3; }
      td.symbol, th.symbol { text-align: left; }
      .positive { color: darkgreen; }
      .negative { color: darkred; }
      button { margin-bottom: 1rem; padding: 0.4rem 0.8rem; }
    </style>
  </head>
  <body>

    <h2>Tax-Loss Candidates</h2>
    <button id="refresh-tax-loss">Refresh Tax-Loss Candidates</button>
    <ul id="tax-loss-list"></ul>
    <h1>Local Robo Advisor</h1>
    <div class="summary">
      <div><strong>Total value:</strong> <span id="total-value">-</span></div>
      <div><strong>Total unrealized P&amp;L:</strong> <span id="total-pnl">-</span></div>
    </div>

    <button id="refresh-btn">Refresh</button>

    <table>
      <thead>
        <tr>
          <th class="symbol">Symbol</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Cost Basis</th>
          <th>Asset Class</th>
          <th>Unrealized P&amp;L</th>
        </tr>
      </thead>
      <tbody id="holdings-table-body">
        <!-- Holdings will be populated here -->
      </tbody>
    </table>

    <script>
      async function loadDashboard() {
        try {
          const response = await fetch('/api/dashboard');
          if (!response.ok) {
            throw new Error('Failed to fetch dashboard data: ' + response.status);
          }
          const data = await response.json();

          const summary = data.summary || {};
          const holdings = data.holdings || [];

          // Update summary
          const totalValueEl = document.getElementById('total-value');
          const totalPnlEl = document.getElementById('total-pnl');

          const totalValue = summary.total_value ?? 0;
          const totalUnrealized = summary.total_unrealized_gain_loss ?? 0;

          totalValueEl.textContent = '$' + totalValue.toFixed(2);
          totalPnlEl.textContent = '$' + totalUnrealized.toFixed(2);
          totalPnlEl.className = totalUnrealized >= 0 ? 'positive' : 'negative';

          // Update holdings table
          const tbody = document.getElementById('holdings-table-body');
          tbody.innerHTML = '';
          holdings.forEach(h => {
            const tr = document.createElement('tr');
            const pnlClass = h.unrealized_gain_loss >= 0 ? 'positive' : 'negative';
            tr.innerHTML = `
              <td class="symbol">${h.symbol}</td>
              <td>${h.quantity}</td>
              <td>${h.price}</td>
              <td>${h.cost_basis}</td>
              <td>${h.asset_class}</td>
              <td class="${pnlClass}">${h.unrealized_gain_loss.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
          });
        } catch (err) {
          document.getElementById('total-value').textContent = 'Error';
          document.getElementById('total-pnl').textContent = String(err);
        }
      }

      document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
      loadDashboard();

    async function loadTaxLossCandidates() {
    const res = await fetch('/api/tax-loss/candidates');
    const data = await res.json();

    const list = document.getElementById('tax-loss-list');
    list.innerHTML = '';

    data.candidates.forEach(c => {
    const li = document.createElement('li');
    const pct = (c.unrealized_pnl_pct * 100).toFixed(2);
    li.textContent = `${c.symbol} (${c.asset_class}): value ${c.current_value.toFixed(2)}, loss ${c.unrealized_pnl.toFixed(2)} (${pct}%)`;
    list.appendChild(li);
    });
    }

    document
    .getElementById('refresh-tax-loss')
    .addEventListener('click', loadTaxLossCandidates);
    </script>
  </body>
</html>
